name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    # 必须使用 GitHub 官方现存支持 Xcode 16 的 macos 镜像
    runs-on: macos-14
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置最新可用 Xcode (Xcode 16)
        run: |
          # 优先使用 Xcode 16 以完美支持 Package.swift 中的 iOS 18 SDK
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 解压与工程环境规整
        run: |
          # 1. 解压仓库中的 zip 压缩包（如果有）
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          # 2. 定位含有 Package.swift 的主目录并规范重命名为 AppSource，规避中文和特殊符号路径
          TARGET_DIR=$(find . -name "Package.swift" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未检测到包含 Package.swift 的工程目录！"
            exit 1
          fi
          echo "定位到源码目录: $TARGET_DIR"
          
          # 规整目录名
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource

          # 3. 清理多余冲突的 Assets
          find AppSource -name "Assets.xcassets" | tail -n +2 | while read -r dup; do rm -rf "$dup"; done

          # 4. 兼容性修剪：Package.swift 最低目标版本修正为 17.0（防止低版本 Xcode 识别不了 18.0 报错）
          sed -i '' 's/\.iOS("18.0")/\.iOS("17.0")/g' AppSource/Package.swift || true

      - name: 执行编译与制作直装包
        run: |
          cd AppSource
          
          # 获取 Playgrounds 默认生成的 scheme
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="AppModule"; fi
          echo "正在构建 Scheme: $SCHEME"

          # 编译成通用的 Release iOS 架构
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # 组装 IPA 的标准 Payload 结构
          mkdir -p Payload
          APP_PATH=$(find ./build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 编译失败，未找到生成的 .app 包！"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/

          # 注入基础 Info.plist 元信息（保证巨魔/签名工具直接能认出 App 名字和图标）
          PLIST_PATH=$(find Payload -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
            plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
            plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true
          fi

          # 压缩成标准 IPA 并移动到工作根目录
          zip -qry output.ipa Payload
          mv output.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "✅ IPA 打包成功: YouDao.ipa"

      - name: 发布 Release 并提供 IPA 下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 直装版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
